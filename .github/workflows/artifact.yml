# Builds the release `victory.exe` of a ref of this fork and publishes it as an
# artifact, so that nothing has to be compiled on the test PC.
name: artifact
run-name: artifact ${{ inputs.ref }} [${{ inputs.tag }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full 40-character SHA of this fork
        required: true
        type: string
      tag:
        description: Optional label used to find the run (A-Z a-z 0-9 . _ -)
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  victory:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        shell: python -I {0}
        env:
          IN_REF: ${{ inputs.ref }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          import os, re, sys
          ref, tag = os.environ["IN_REF"], os.environ["IN_TAG"]
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9._/-]{0,99}", ref) or ".." in ref:
              sys.exit("::error::ref: invalid")
          if not re.fullmatch(r"[A-Za-z0-9._-]{0,64}", tag):
              sys.exit("::error::tag: invalid")

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: artifact
          # Only main writes the cache, so a branch cannot poison it for others.
          save-if: ${{ inputs.ref == 'main' }}

      - name: build
        run: cargo build --release -p victory --locked

      # victory.exe needs no file of ours beside it: it imports only DLLs of
      # Windows and of the Visual C++ runtime. The .pdb names crash frames.
      # The D3D12 Agility SDK (.\D3D12\) is only for Windows 10 and not shipped.
      - name: package
        shell: python -I {0}
        env:
          IN_REF: ${{ inputs.ref }}
        run: |
          import hashlib, json, os, shutil, subprocess
          def out(*cmd):
              return subprocess.run(cmd, capture_output=True, text=True, check=True).stdout.strip()
          dist = os.path.join(os.environ["RUNNER_TEMP"], "dist")
          os.makedirs(dist)
          for src in ("target/release/victory.exe", "target/release/victory.pdb", "LICENSE"):
              shutil.copy2(src, dist)
          sha = out("git", "rev-parse", "HEAD")
          info = {
              "ref": os.environ["IN_REF"], "sha": sha, "rustc": out("rustc", "--version"),
              "command": "cargo build --release -p victory --locked",
              "run_url": "%s/%s/actions/runs/%s" % (os.environ["GITHUB_SERVER_URL"],
                                                    os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]),
          }
          with open(os.path.join(dist, "sha.txt"), "w", newline="\n") as f:
              f.write(sha + "\n")
          with open(os.path.join(dist, "build-info.json"), "w", newline="\n") as f:
              json.dump(info, f, indent=2)
          sums = []
          for name in sorted(os.listdir(dist)):
              with open(os.path.join(dist, name), "rb") as f:
                  sums.append("%s  %s\n" % (hashlib.sha256(f.read()).hexdigest(), name))
          with open(os.path.join(dist, "SHA256SUMS"), "w", newline="\n") as f:
              f.write("".join(sums))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## victory.exe of `%s`\n\ncommit `%s`\n\n```\n%s```\n" % (info["ref"], sha, "".join(sums)))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: victory
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30
